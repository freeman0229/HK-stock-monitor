name: Daily Sync

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 12:00 UTC / 20:00 HKT (Mon–Fri)
    - cron: '0 14 * * 1-5'   # 14:00 UTC / 22:00 HKT (Mon–Fri) — SFC check
    - cron: '0 13 * * 1-5'   # 13:00 UTC / 21:00 HKT (Mon–Fri)  — SDW weekly run 1
    - cron: '0 15 * * 1-5'   # 15:00 UTC / 23:00 HKT (Mon–Fri)  — SDW weekly run 2
    - cron: '0 2 * * 6'       # 02:00 UTC / 10:00 HKT (Saturday)
    - cron: '0 3 * * 6'       # 03:00 UTC / 11:00 HKT (Saturday)  — HSI weekly update
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - sfc-check
          - sfc-weekly
          - di-weekly
          - both-weekly
          - ccass-build
          - sc-top10-build
          - sdw-build
          - sdw-weekly
          - sfc-build
          - turnover-build   # rebuild turnover library from scratch
          - short-build      # rebuild short selling library from scratch
          - ccass-universe   # rebuild CCASS universe
          - sdw-backfill     # manual: backfill a specific date range
          - sdw-migrate-json # one-time: import old ccass_sdw_*.json files into SQLite DB
          - hsi-build        # manual: rebuild full HSI weekly history from scratch
      month:
        description: 'Date to backfill (YYYY-MM-DD) — e.g. 2025-04-11. Required for sdw-backfill.'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Daily analysis (Mon–Fri 20:00 HKT) ─────────────────────────────────────
  daily:
    name: Daily analysis
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'daily')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium

      - name: Fetch today's turnover data
        run: python build_turnover.py

      - name: Fetch today's short selling data
        run: python build_short.py

      - name: Update Stock Connect top10 (today + repair incomplete history)
        run: python sc_top10_library.py --update

      - name: Update CCASS southbound holdings (today)
        run: python ccass_library.py --update --fix-names

      - name: Run daily analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in data.json rank_history.json name_map.json; do
            [ -f "$f" ] && git add "$f"
          done
          for f in ccass_20*.json ccass_sdw_*_20*.json ccass_sdw_20*.json sc_top10_20*.json short_20*.json turnover_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Update data: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SFC nightly check (Mon–Fri 22:00 HKT) ────────────────────────────────────
  sfc-check:
    name: SFC nightly check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 14 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'sfc-check')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SFC cache
        uses: actions/cache@v4
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
          restore-keys: sfc-cache-
      - name: Fetch any new SFC reports
        run: python sfc_library.py
      - name: Save SFC cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sfc_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "SFC check: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── CCASS full build (manual) ────────────────────────────────────────────────
  ccass-build:
    name: CCASS full build (2025-03-23 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'ccass-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Build CCASS library
        run: python ccass_library.py --fix-names
      - name: Commit progress
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in ccass_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "CCASS build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Stock Connect top10 full build (manual) ───────────────────────────────────
  sc-top10-build:
    name: Stock Connect top10 full build (2025-09-01 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sc-top10-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SC top10 cache
        uses: actions/cache@v4
        with:
          path: sc_cache
          key: sc-top10-cache-${{ github.run_id }}
          restore-keys: sc-top10-cache-
      - name: Clear stale sc_cache
        run: python sc_top10_library.py --clear-cache
      - name: Build Stock Connect top10 library
        run: python sc_top10_library.py
      - name: Commit progress
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sc_top10_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "SC top10 build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SDW full backfill (manual) ───────────────────────────────────────────────
  # Fetches all scheduled Fridays from START_DATE into ccass_sdw.db.
  # Run sdw-migrate-json first if you have existing ccass_sdw_*.json files.
  sdw-build:
    name: SDW full backfill (all dates → SQLite DB)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Restore SDW database cache
        uses: actions/cache@v4
        with:
          path: ccass_sdw.db
          key: sdw-db-${{ github.run_id }}
          restore-keys: sdw-db-
      - name: Full SDW backfill → ccass_sdw.db
        env:
          SDW_PROXY: ${{ secrets.SDW_PROXY }}
        run: python ccass_sdw_library.py
      - name: Save SDW database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ccass_sdw.db
          key: sdw-db-${{ github.run_id }}
      - name: Commit DB
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          [ -f "ccass_sdw.db" ] && git add "ccass_sdw.db"
          git diff --staged --quiet || \
            (git commit -m "SDW build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SDW weekly (Mon–Fri 21:00 + 23:00 HKT) ──────────────────────────────────
  # Runs --update: fetches only the latest Friday not yet in the DB.
  sdw-weekly:
    name: SDW weekly update → ccass_sdw.db
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && (github.event.schedule == '0 13 * * 1-5' || github.event.schedule == '0 15 * * 1-5')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-weekly')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Restore SDW database cache
        uses: actions/cache@v4
        with:
          path: ccass_sdw.db
          key: sdw-db-${{ github.run_id }}
          restore-keys: sdw-db-
      - name: Fetch latest Friday SDW data
        env:
          SDW_PROXY: ${{ secrets.SDW_PROXY }}
        run: python ccass_sdw_library.py --update
      - name: Save SDW database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ccass_sdw.db
          key: sdw-db-${{ github.run_id }}
      - name: Commit DB
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          [ -f "ccass_sdw.db" ] && git add "ccass_sdw.db"
          git diff --staged --quiet || \
            (git commit -m "SDW weekly: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SFC weekly (Saturday 10:00 HKT) ──────────────────────────────────────────
  sfc-weekly:
    name: SFC short position library
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 6') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'sfc-weekly' || inputs.job == 'both-weekly'))

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SFC cache
        uses: actions/cache@v4
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
          restore-keys: sfc-cache-
      - name: Update CCASS participant list
        run: python ccass_participant_library.py --update

      - name: Update CCASS universe
        run: python ccass_universe.py

      - name: Update SFC library
        run: python sfc_library.py
      - name: Re-parse cached Excel files
        run: python sfc_library.py --reparse
      - name: Save SFC cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sfc_20*.json; do [ -f "$f" ] && git add "$f"; done
          [ -f "ccass_participants.json" ] && git add "ccass_participants.json"
          [ -f "ccass_universe.json" ] && git add "ccass_universe.json"
          git diff --staged --quiet || \
            (git commit -m "SFC weekly: $(date +'%Y-%m-%d')" && git push)

  # ── Turnover + short full rebuild (manual) ───────────────────────────────────
  # Re-fetches every trading day from START_DATE. Use --rebuild to overwrite existing.
  # turnover_{YYYY}.json: name_en, name_zh, prev_close, close, vol, tv
  # short_{YYYY}.json:    name, sv (股數SH), st (金額$)
  turnover-build:
    name: Turnover + short full rebuild (2026-02-02 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'turnover-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Rebuild turnover library (all stocks, all columns)
        run: python build_turnover.py --rebuild

      - name: Rebuild short selling library (all stocks, all columns)
        run: python build_short.py --rebuild

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in turnover_20*.json short_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Turnover+short rebuild: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Short selling full rebuild (manual) ──────────────────────────────────────
  # Re-fetches every date from START_DATE using next trading day's file.
  # short_{YYYY}.json: name, sv (股數SH), st (金額$)
  short-build:
    name: Short selling library full rebuild (2026-02-02 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'short-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Rebuild short selling library (all stocks, all columns)
        run: python build_short.py --rebuild

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in short_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Short rebuild: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SFC full backfill (manual) ────────────────────────────────────────────────
  sfc-build:
    name: SFC full backfill (2018-01-01 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sfc-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SFC Excel cache
        uses: actions/cache@v4
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
          restore-keys: sfc-cache-
      - name: Full SFC backfill
        run: python sfc_library.py
      - name: Re-parse all cached Excel files
        run: python sfc_library.py --reparse
      - name: Save SFC Excel cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sfc_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "SFC build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── DI weekly (Saturday 10:00 HKT) ───────────────────────────────────────────
  di-weekly:
    name: DI substantial shareholder library
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 6') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'di-weekly' || inputs.job == 'both-weekly'))

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore DI cache
        uses: actions/cache@v4
        with:
          path: di_cache
          key: di-cache-${{ github.run_id }}
          restore-keys: di-cache-
      - name: Update DI library
        run: python di_library.py --update
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in di_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "DI weekly: $(date +'%Y-%m-%d')" && git push)

  # ── CCASS universe build (manual) ────────────────────────────────────────────
  ccass-universe:
    name: CCASS universe build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'ccass-universe'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Build CCASS universe
        run: python ccass_universe.py
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          [ -f "ccass_universe.json" ] && git add "ccass_universe.json"
          git diff --staged --quiet || \
            (git commit -m "CCASS universe build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SDW single-date backfill (manual) ──────────────────────────────────────
  # Usage: workflow_dispatch → sdw-backfill, month = YYYY-MM-DD (e.g. 2025-04-11)
  sdw-backfill:
    name: SDW backfill ${{ inputs.month }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-backfill'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Restore SDW database cache
        uses: actions/cache@v4
        with:
          path: ccass_sdw.db
          key: sdw-db-${{ github.run_id }}
          restore-keys: sdw-db-
      - name: Backfill SDW for date ${{ inputs.month }}
        env:
          SDW_PROXY: ${{ secrets.SDW_PROXY }}
        run: python ccass_sdw_library.py --date ${{ inputs.month }}
      - name: Save SDW database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ccass_sdw.db
          key: sdw-db-${{ github.run_id }}
      - name: Commit DB
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          [ -f "ccass_sdw.db" ] && git add "ccass_sdw.db"
          git diff --staged --quiet || \
            (git commit -m "SDW backfill ${{ inputs.month }}: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SDW migrate JSON → SQLite (one-time) ─────────────────────────────────────
  # Place all ccass_sdw_*.json files in the repo root, then run this job.
  # Imports them into ccass_sdw.db and commits the DB.
  sdw-migrate-json:
    name: SDW migrate ccass_sdw_*.json → ccass_sdw.db
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-migrate-json'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Import JSON files into SQLite DB
        run: python ccass_sdw_library.py --migrate-json
      - name: Show DB stats
        run: python ccass_sdw_library.py --stats
      - name: Commit DB
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          [ -f "ccass_sdw.db" ] && git add "ccass_sdw.db"
          git diff --staged --quiet || \
            (git commit -m "SDW migrate JSON→DB: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── HSI weekly price history (Saturday 11:00 HKT) ────────────────────────────
  hsi-weekly:
    name: HSI weekly update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 6') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'hsi-build')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Update HSI weekly history
        run: |
          if [ "${{ inputs.job }}" = "hsi-build" ]; then
            python build_hsi.py --rebuild
          else
            python build_hsi.py
          fi
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          [ -f hsi_weekly.json ] && git add hsi_weekly.json
          git diff --staged --quiet || git commit -m "HSI weekly: $(date +'%Y-%m-%d %H:%M')"
          git push
