name: Daily Sync

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 12:00 UTC / 20:00 HKT (Mon–Fri)
    - cron: '0 14 * * 1-5'   # 14:00 UTC / 22:00 HKT (Mon–Fri) — SFC check
    - cron: '0 2 * * 6'       # 02:00 UTC / 10:00 HKT (Saturday)
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - sfc-weekly
          - di-weekly
          - both-weekly
          - ccass-build      # full CCASS build from 2025-03-23 (run multiple times)
          - sc-top10-build   # full Stock Connect top10 build (run multiple times)
          - sdw-build        # full SDW participant holdings backfill (run multiple times)
          - sfc-build        # full SFC backfill from 2018-01-01 (run multiple times)
          - sfc-reparse      # re-parse all cached SFC Excel files (fixes hkd=0 bug)
          - turnover-build   # backfill turnover library from 2026-02-02 (adds high/low/close)
          - short-build      # backfill short selling library from 2026-03-20

# Cancel any in-progress run of the same workflow when a new one is triggered.
# This prevents multiple github-pages artifacts accumulating across runs,
# which causes deploy-pages@v4 to fail with "Multiple artifacts found".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Daily analysis (Mon–Fri 20:00 HKT) ─────────────────────────────────────
  daily:
    name: Daily analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'daily')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Backfill any missing or bad turnover dates
        run: python build_turnover.py

      - name: Backfill any missing short selling dates
        run: python build_short.py

      - name: Update Stock Connect top10 (today + repair incomplete history)
        run: python sc_top10_library.py --update

      - name: Refresh CCASS participant list (weekly)
        run: python ccass_participant_library.py --update

      - name: SDW participant holdings (Thu/Fri weekly)
        run: |
          DOW=$(date +%u)   # 1=Mon … 4=Thu, 5=Fri
          if [ "$DOW" = "4" ] || [ "$DOW" = "5" ]; then
            # Use --date so we only fetch THIS week — --update would try all
            # 50+ missing weeks, hit the 45-min timeout, and commit nothing.
            # Historical backfill is handled by the manual sdw-build job.
            python ccass_sdw_library.py --date "$(date +%Y-%m-%d)"
          else
            echo "Not Thu/Fri (DOW=$DOW) — skipping SDW fetch"
          fi

      - name: Restore SFC cache (needed for reparse)
        uses: actions/cache@v4
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
          restore-keys: sfc-cache-

      - name: Check SFC for new reports (any day)
        run: python sfc_library.py --update

      - name: Run daily analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in data.json rank_history.json name_map.json; do
            [ -f "$f" ] && git add "$f"
          done
          for f in ccass_20*.json ccass_sdw_*_20*.json ccass_sdw_20*.json sc_top10_20*.json short_20*.json turnover_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Update data: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── CCASS full build (manual, resume-able) ───────────────────────────────────
  ccass-build:
    name: CCASS full build (2025-03-23 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'ccass-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Build CCASS library (resumes from last saved date)
        run: python ccass_library.py
      - name: Commit progress
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in ccass_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "CCASS build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Stock Connect top10 full build (manual, resume-able) ─────────────────────
  sc-top10-build:
    name: Stock Connect top10 full build
    runs-on: ubuntu-latest
    timeout-minutes: 320
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sc-top10-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SC top10 cache
        uses: actions/cache@v4
        with:
          path: sc_cache
          key: sc-top10-cache-${{ github.run_id }}
          restore-keys: sc-top10-cache-
      - name: Clear stale sc_cache (stored parsed JSON, not raw JS)
        run: python sc_top10_library.py --clear-cache
      - name: Build Stock Connect top10 library (resumes from last saved date)
        run: python sc_top10_library.py
      - name: Commit progress
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sc_top10_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "SC top10 build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SDW full backfill (manual, resume-able) ─────────────────────────────────
  sdw-build:
    name: SDW participant holdings full backfill (range-split, all SFC stocks)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Check SFC library files exist (required for stock universe)
        run: |
          if ! ls sfc_20*.json 1>/dev/null 2>&1; then
            echo "ERROR: No sfc_20*.json files found in repo."
            echo "Run sfc-build first to build the SFC short position library,"
            echo "which provides the stock universe for SDW fetching."
            exit 1
          fi
          echo "SFC files found: $(ls sfc_20*.json | tr '\n' ' ')"
      - name: Migrate old single-file SDW data to range-split format (safe to re-run)
        run: python ccass_sdw_library.py --migrate
      - name: Build SDW holdings library (resumes from last stored date)
        run: python ccass_sdw_library.py
      - name: Commit progress
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in ccass_sdw_*_20*.json ccass_sdw_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "SDW build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SFC check (also runs daily at 22:00 HKT as part of daily job) ────────────
  sfc-weekly:
    name: SFC short position library (manual / Saturday reparse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 6') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'sfc-weekly' || inputs.job == 'both-weekly'))

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SFC cache
        uses: actions/cache@v4
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
          restore-keys: sfc-cache-
      - name: Update SFC library
        run: python sfc_library.py --update
      - name: Re-parse cached Excel files
        run: python sfc_library.py --reparse
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sfc_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "SFC weekly: $(date +'%Y-%m-%d')" && git push)

  # ── SFC reparse (manual — repairs hkd=0 in historical JSON from cache) ───────
  sfc-reparse:
    name: SFC reparse cached Excel files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sfc-reparse'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SFC cache
        uses: actions/cache@v4
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
          restore-keys: sfc-cache-
      - name: Reparse all cached Excel files
        run: python sfc_library.py --reparse
      - name: Inspect results
        run: python sfc_library.py --inspect
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sfc_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "SFC reparse: $(date +'%Y-%m-%d')" && git push)


  # ── Short selling backfill (manual — fetches missing dates from 2026-03-20) ─
  short-build:
    name: Short selling library backfill (2026-03-20 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'short-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Backfill missing dates and fix records without names
        run: |
          python build_short.py --fix-names
          python build_short.py
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in short_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Short build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Turnover backfill (manual — fetches missing/bad dates, adds high/low/close) ─
  turnover-build:
    name: Turnover library backfill (2026-02-02 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'turnover-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Backfill turnover library (missing dates + bad data + add high/low/close)
        run: python build_turnover.py
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in turnover_20*.json name_map.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Turnover build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── DI weekly (Saturday 10:00 HKT) ──────────────────────────────────────────
  sfc-build:
    name: SFC full backfill (2018-01-01 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sfc-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SFC Excel cache (avoids re-downloading on each re-run)
        uses: actions/cache@v4
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
          restore-keys: sfc-cache-
      - name: Full SFC backfill (resumes from last stored date)
        run: python sfc_library.py
      - name: Re-parse all cached Excel files (fixes schema)
        run: python sfc_library.py --reparse
      - name: Save SFC Excel cache (so next re-run skips re-downloading)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sfc_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "SFC build: $(date +'%Y-%m-%d %H:%M')" && git push)


  di-weekly:
    name: DI substantial shareholder library
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 6') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'di-weekly' || inputs.job == 'both-weekly'))

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore DI cache
        uses: actions/cache@v4
        with:
          path: di_cache
          key: di-cache-${{ github.run_id }}
          restore-keys: di-cache-
      - name: Update DI library
        run: python di_library.py --update
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in di_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "DI weekly: $(date +'%Y-%m-%d')" && git push)
