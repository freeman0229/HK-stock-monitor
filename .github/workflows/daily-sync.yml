name: Daily Sync

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 11:00 UTC / 19:00 HKT (Mon–Fri) — early fetch
    - cron: '0 12 * * 1-5'   # 12:00 UTC / 20:00 HKT (Mon–Fri)
    - cron: '0 6 * * 6'    # 06:00 UTC / 14:00 HKT (Saturday) — SDW weekly run 1
    - cron: '0 10 * * 6'   # 10:00 UTC / 18:00 HKT (Saturday) — SDW weekly run 2
    - cron: '0 2 * * 6'       # 02:00 UTC / 10:00 HKT (Saturday)
    - cron: '0 3 * * 6'       # 03:00 UTC / 11:00 HKT (Saturday)  — HSI weekly update
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - early-fetch
          - sfc-weekly
          - di-weekly
          - both-weekly
          - ccass-build
          - sc-top10-build
          - sdw-build
          - sdw-weekly
          - sfc-build
          - turnover-build   # rebuild turnover library from scratch
          - short-build      # rebuild short selling library from scratch
          - ccass-universe   # rebuild CCASS universe
          - sdw-backfill     # manual: backfill a specific date range (2 workers, conservative)
          - sdw-backfill-3w  # manual: backfill a specific date range (3 workers, recommended)
          - sdw-migrate-json # one-time: import old ccass_sdw_*.json files into SQLite DB
          - hsi-build        # manual: rebuild full HSI weekly history from scratch
          - rank-history-backfill  # manual: rebuild rank_history.json from 2026-02-02
      backfill_date:
        description: 'Date to backfill (YYYY-MM-DD) — e.g. 2025-04-11. Required for sdw-backfill.'
        required: false
        default: ''
        type: string


jobs:

  # ── Early fetch (Mon–Fri 19:00 HKT) ──────────────────────────────────────────
  # Stock Connect top-10 and CCASS southbound data are published ~18:xx HKT.
  # Fetching at 19:00 gives main.py fresh data when it runs at 20:00.
  early-fetch:
    name: Early fetch — Stock Connect + CCASS southbound
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: early-fetch
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'early-fetch')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium

      - name: Update Stock Connect top10 (today + repair incomplete history)
        run: python sc_top10_library.py --update

      - name: Update CCASS southbound holdings (today)
        run: python ccass_library.py --update --fix-names

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sc_top10_20*.json ccass_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Early fetch: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Daily analysis (Mon–Fri 20:00 HKT) ─────────────────────────────────────
  # Depends on early-fetch (19:00) having already committed sc_top10 + ccass data.
  daily:
    name: Daily analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: daily
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'daily')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
        # Note: playwright not needed here — sc_top10 + ccass run in early-fetch job at 19:00

      - name: Download turnover files from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
          R2_ENDPOINT_URL      : ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          aws s3 cp s3://hk-stock-monitor/turnover_2026.json turnover_2026.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          echo "Warning: turnover_2026.json not found in R2"
          aws s3 cp s3://hk-stock-monitor/turnover_2025.json turnover_2025.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          echo "Warning: turnover_2025.json not found in R2"

      - name: Fetch today's turnover data
        run: python build_turnover.py
        # Parses HKEX quotation file (d{YYMMDD}c.htm top section) → writes turnover_{Y}.json

      - name: Fetch today's short selling data
        run: python build_short.py
        # Parses short sell section from next trading day's file → writes short_{Y}.json
        # Short data has 1-day lag by design: D's short is published in D+1's file.

      - name: Download SDW DB from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/ccass_sdw.db ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          echo "Warning: ccass_sdw.db not found in R2 — SDW holders will be empty"

      - name: Run daily analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Split turnover into monthly files
        run: python split_turnover.py --year $(date +'%Y')

      - name: Upload turnover_2026.json to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
          R2_ENDPOINT_URL      : ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          [ -f turnover_2026.json ] && aws s3 cp turnover_2026.json \
            s3://hk-stock-monitor/turnover_2026.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          echo "Warning: turnover_2026.json upload failed"

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in data.json rank_history.json name_map.json; do
            [ -f "$f" ] && git add "$f"
          done
          for f in short_20*.json turnover_20*_??.json sfc_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          # turnover_20*_??.json matches monthly files only (e.g. turnover_2026_05.json)
          # NOT turnover_2026.json / turnover_2025.json (full-year R2 working files)
          # sc_top10_20*.json and ccass_20*.json committed by early-fetch at 19:00
          git diff --staged --quiet || \
            (git commit -m "Update data: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── CCASS full build (manual) ────────────────────────────────────────────────
  ccass-build:
    name: CCASS full build (2025-03-23 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: ccass-build
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'ccass-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Build CCASS library
        run: python ccass_library.py --fix-names
      - name: Commit progress
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in ccass_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "CCASS build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Stock Connect top10 full build (manual) ───────────────────────────────────
  sc-top10-build:
    name: Stock Connect top10 full build (2025-09-01 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: sc-top10-build
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sc-top10-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SC top10 cache
        uses: actions/cache@v4
        with:
          path: sc_cache
          key: sc-top10-cache-${{ github.run_id }}
          restore-keys: sc-top10-cache-
      - name: Clear stale sc_cache
        run: python sc_top10_library.py --clear-cache
      - name: Build Stock Connect top10 library
        run: python sc_top10_library.py
      - name: Save SC top10 cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: sc_cache
          key: sc-top10-cache-${{ github.run_id }}
      - name: Commit progress
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sc_top10_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "SC top10 build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SDW full backfill (manual) ───────────────────────────────────────────────
  # Fetches all scheduled Fridays from START_DATE into ccass_sdw.db.
  # Run sdw-migrate-json first if you have existing ccass_sdw_*.json files.
  sdw-build:
    name: SDW full backfill (all dates → SQLite DB)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: sdw-db-lock
      cancel-in-progress: false
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Download DB from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/ccass_sdw.db ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          { echo "ERROR: DB download failed — aborting"; exit 1; }
      - name: Full SDW backfill → ccass_sdw.db
        env:
          SDW_WORKERS: "3"
          SDW_WORKER_TIMEOUT: "5400"
        run: |
          python ccass_sdw_library.py
      - name: Verify DB before upload
        run: |
          DATES=$(sqlite3 ccass_sdw.db "SELECT COUNT(DISTINCT date) FROM holdings;")
          ROWS=$(sqlite3 ccass_sdw.db "SELECT COUNT(*) FROM holdings;")
          echo "DB has $DATES distinct dates and $ROWS total holdings rows"
          [ "$ROWS" -gt 100 ] || \
            { echo "ERROR: DB has only $ROWS holdings rows — aborting upload to protect R2 data"; exit 1; }
      - name: Upload DB to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          [ -f "ccass_sdw.db" ] && aws s3 cp ccass_sdw.db s3://hk-stock-monitor/ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
      - name: Export SDW chart files
        run: python ccass_sdw_library.py --export-charts
      - name: Upload SDW chart files to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 sync . s3://hk-stock-monitor/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --exclude "*" --include "sdw_*.json" \
            --no-progress

  # ── SDW weekly (Saturday: 14:00 HKT run 1 + 18:00 HKT run 2) ──────────────────
  # Runs --update: fetches only the latest Friday not yet in the DB.
  # Two runs cover HKEX SDW publishing delays; idempotent so reruns are safe.
  sdw-weekly:
    name: SDW weekly update → ccass_sdw.db
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: sdw-db-lock
      cancel-in-progress: false
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && (github.event.schedule == '0 6 * * 6' || github.event.schedule == '0 10 * * 6')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-weekly')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Download DB from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/ccass_sdw.db ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          { echo "ERROR: DB download failed — aborting"; exit 1; }
      - name: Fetch latest Friday SDW data
        env:
          SDW_WORKERS: "3"
          SDW_WORKER_TIMEOUT: "5400"
        run: |
          python ccass_sdw_library.py --update
      - name: Verify DB before upload
        run: |
          DATES=$(sqlite3 ccass_sdw.db "SELECT COUNT(DISTINCT date) FROM holdings;")
          ROWS=$(sqlite3 ccass_sdw.db "SELECT COUNT(*) FROM holdings;")
          echo "DB has $DATES distinct dates and $ROWS total holdings rows"
          [ "$ROWS" -gt 100 ] || \
            { echo "ERROR: DB has only $ROWS holdings rows — aborting upload to protect R2 data"; exit 1; }
      - name: Upload DB to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          [ -f "ccass_sdw.db" ] && aws s3 cp ccass_sdw.db s3://hk-stock-monitor/ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
      - name: Export SDW chart files
        run: python ccass_sdw_library.py --export-charts
      - name: Upload SDW chart files to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 sync . s3://hk-stock-monitor/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --exclude "*" --include "sdw_*.json" \
            --no-progress

  # ── SFC weekly (Saturday 10:00 HKT) ──────────────────────────────────────────
  sfc-weekly:
    name: SFC short position library
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sfc-weekly
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 6') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'sfc-weekly' || inputs.job == 'both-weekly'))

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SFC cache
        uses: actions/cache@v4
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
          restore-keys: sfc-cache-
      - name: Update CCASS participant list
        run: |
          python ccass_participant_library.py --update || \
          echo "Warning: participant update failed, continuing"

      - name: Update CCASS universe
        run: |
          python ccass_universe.py || \
          echo "Warning: universe update failed, continuing"

      - name: Update SFC library
        run: python sfc_library.py
      - name: Re-parse cached Excel files
        run: python sfc_library.py --reparse
      - name: Save SFC cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sfc_20*.json; do [ -f "$f" ] && git add "$f"; done
          [ -f "ccass_participants.json" ] && git add "ccass_participants.json"
          [ -f "ccass_universe.json" ] && git add "ccass_universe.json"
          git diff --staged --quiet || \
            (git commit -m "SFC weekly: $(date +'%Y-%m-%d')" && git push)

  # ── Turnover + short full rebuild (manual) ───────────────────────────────────
  # Re-fetches every trading day from START_DATE. Use --rebuild to overwrite existing.
  # build_turnover.py writes BOTH turnover_{Y}.json AND short_{Y}.json (same source page).
  # build_short.py --rebuild is also run to backfill any edge-case date gaps.
  # turnover_{YYYY}.json: name_en, name_zh, prev_close, close, vol, tv, high, low
  # short_{YYYY}.json:    name, sv (股數SH), st (金額$)
  turnover-build:
    name: Turnover + short full rebuild (2026-02-02 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: turnover-build
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'turnover-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Rebuild turnover library (all stocks, all columns)
        run: python build_turnover.py --rebuild

      - name: Split turnover into monthly files
        run: python split_turnover.py --year $(date +'%Y')

      - name: Rebuild short selling library (all stocks, all columns)
        run: python build_short.py --rebuild

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in turnover_20*_??.json short_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Turnover+short rebuild: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Short selling full rebuild (manual, standalone) ─────────────────────────
  # Use when you need to rebuild ONLY short_{Y}.json without touching turnover.
  # For a full rebuild of both, use turnover-build instead (it runs both scripts).
  # short_{YYYY}.json: name, sv (股數SH), st (金額$)
  short-build:
    name: Short selling library full rebuild (2026-02-02 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: short-build
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'short-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Rebuild short selling library (all stocks, all columns)
        run: python build_short.py --rebuild

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in short_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Short rebuild: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SFC full backfill (manual) ────────────────────────────────────────────────
  sfc-build:
    name: SFC full backfill (2018-01-01 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: sfc-build
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sfc-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SFC Excel cache
        uses: actions/cache@v4
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
          restore-keys: sfc-cache-
      - name: Full SFC backfill
        run: python sfc_library.py
      - name: Re-parse all cached Excel files
        run: python sfc_library.py --reparse
      - name: Save SFC Excel cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sfc_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "SFC build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── DI weekly (Saturday 10:00 HKT) ───────────────────────────────────────────
  di-weekly:
    name: DI substantial shareholder library
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: di-weekly
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 6') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'di-weekly' || inputs.job == 'both-weekly'))

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore DI cache
        uses: actions/cache@v4
        with:
          path: di_cache
          key: di-cache-${{ github.run_id }}
          restore-keys: di-cache-
      - name: Update DI library
        run: python di_library.py --update
      - name: Save DI cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: di_cache
          key: di-cache-${{ github.run_id }}
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in di_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "DI weekly: $(date +'%Y-%m-%d')" && git push)

  # ── CCASS universe build (manual) ────────────────────────────────────────────
  ccass-universe:
    name: CCASS universe build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ccass-universe
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'ccass-universe'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Build CCASS universe
        run: python ccass_universe.py
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          [ -f "ccass_universe.json" ] && git add "ccass_universe.json"
          git diff --staged --quiet || \
            (git commit -m "CCASS universe build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SDW single-date backfill (manual) ──────────────────────────────────────
  # Usage: workflow_dispatch → sdw-backfill, month = YYYY-MM-DD (e.g. 2025-04-11)
  sdw-backfill:
    name: SDW backfill ${{ inputs.backfill_date }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: sdw-db-lock
      cancel-in-progress: false
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-backfill'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Download DB from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/ccass_sdw.db ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          { echo "ERROR: DB download failed — aborting"; exit 1; }
      - name: Backfill SDW for date ${{ inputs.backfill_date }}
        env:
          SDW_WORKERS: "2"
        run: python ccass_sdw_library.py --date "${{ inputs.backfill_date }}"
      - name: Verify DB before upload
        run: |
          DATE="${{ inputs.backfill_date }}"
          COUNT=$(sqlite3 ccass_sdw.db "SELECT COUNT(*) FROM holdings WHERE date='${DATE}';")
          echo "DB has $COUNT holdings rows for ${DATE}"
          [ "$COUNT" -gt 100 ] || \
            { echo "ERROR: DB has only $COUNT rows for ${DATE} — aborting upload to protect R2 data"; exit 1; }
      - name: Upload DB to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          [ -f "ccass_sdw.db" ] && aws s3 cp ccass_sdw.db s3://hk-stock-monitor/ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
      - name: Export SDW chart files
        run: python ccass_sdw_library.py --export-charts
      - name: Upload SDW chart files to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 sync . s3://hk-stock-monitor/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --exclude "*" --include "sdw_*.json" \
            --no-progress

  # ── SDW single-date backfill — 3 workers (manual, test) ─────────────────────
  # Same as sdw-backfill but with SDW_WORKERS=3 — recommended based on 90min/2643-stock benchmark.
  # Usage: workflow_dispatch → sdw-backfill-3w, backfill_date = YYYY-MM-DD
  sdw-backfill-3w:
    name: SDW backfill 3w ${{ inputs.backfill_date }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: sdw-db-lock
      cancel-in-progress: false
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-backfill-3w'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Download DB from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/ccass_sdw.db ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          { echo "ERROR: DB download failed — aborting"; exit 1; }
      - name: Backfill SDW for date ${{ inputs.backfill_date }} (3 workers)
        env:
          SDW_WORKERS: "3"
          SDW_WORKER_TIMEOUT: "5400"
        run: python ccass_sdw_library.py --date "${{ inputs.backfill_date }}"
      - name: Verify DB before upload
        run: |
          DATE="${{ inputs.backfill_date }}"
          COUNT=$(sqlite3 ccass_sdw.db "SELECT COUNT(*) FROM holdings WHERE date='${DATE}';")
          echo "DB has $COUNT holdings rows for ${DATE}"
          [ "$COUNT" -gt 100 ] || \
            { echo "ERROR: DB has only $COUNT rows for ${DATE} — aborting upload to protect R2 data"; exit 1; }
      - name: Upload DB to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          [ -f "ccass_sdw.db" ] && aws s3 cp ccass_sdw.db s3://hk-stock-monitor/ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
      - name: Export SDW chart files
        run: python ccass_sdw_library.py --export-charts
      - name: Upload SDW chart files to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 sync . s3://hk-stock-monitor/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --exclude "*" --include "sdw_*.json" \
            --no-progress

  # ── SDW migrate JSON → SQLite (one-time) ─────────────────────────────────────
  # Downloads existing DB from R2, migrates schema if needed, then imports any
  # missing dates from sdw_*.json files in R2. Never deletes existing data.
  sdw-migrate-json:
    name: SDW migrate ccass_sdw_*.json → ccass_sdw.db
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sdw-db-lock
      cancel-in-progress: false
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-migrate-json'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Download existing DB from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/ccass_sdw.db ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          { echo "ERROR: DB download failed — aborting"; exit 1; }
      - name: Migrate schema to v5 (normalise participants)
        run: python ccass_sdw_library.py --migrate-schema
      - name: Download sdw_*.json files from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 sync s3://hk-stock-monitor/ . \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --exclude "*" --include "sdw_*.json" \
            --no-progress
          echo "Downloaded $(ls sdw_*.json 2>/dev/null | wc -l) JSON files" || true
      - name: Import missing dates from JSON files into DB
        run: |
          python3 - <<'EOF'
          import glob, json, os, sqlite3, re
          from datetime import datetime

          DB = "ccass_sdw.db"
          if not os.path.exists(DB):
              print(f"ERROR: {DB} not found — DB must be downloaded first"); exit(1)

          files = sorted(glob.glob("sdw_*.json"))
          print(f"Found {len(files)} sdw_*.json files to import")
          if not files:
              print("ERROR: no sdw_*.json files found"); exit(1)

          conn = sqlite3.connect(DB)

          # Ensure v5 schema tables exist (safe — CREATE TABLE IF NOT EXISTS)
          conn.executescript("""
              CREATE TABLE IF NOT EXISTS metadata (
                  date TEXT NOT NULL, code TEXT NOT NULL,
                  total_sh INTEGER NOT NULL DEFAULT 0,
                  issued_sh INTEGER NOT NULL DEFAULT 0,
                  fetched_at TEXT,
                  PRIMARY KEY (date, code));
              CREATE TABLE IF NOT EXISTS participants (
                  pid   TEXT PRIMARY KEY,
                  name  TEXT NOT NULL);
              CREATE TABLE IF NOT EXISTS holdings (
                  date TEXT NOT NULL, code TEXT NOT NULL,
                  pid TEXT NOT NULL,
                  shares INTEGER NOT NULL, pct REAL NOT NULL,
                  PRIMARY KEY (date, code, pid));
              CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT NOT NULL);
              CREATE INDEX IF NOT EXISTS idx_meta_date ON metadata(date);
              CREATE INDEX IF NOT EXISTS idx_hold_date_code ON holdings(date, code);
          """)

          total_imported = 0
          total_skipped  = 0
          now = datetime.utcnow().isoformat(timespec="seconds") + "Z"

          for fpath in files:
              code = os.path.basename(fpath).replace("sdw_","").replace(".json","")
              if not re.match(r'^\d{5}$', code):
                  print(f"  skip {fpath}: cannot parse code")
                  continue
              try:
                  with open(fpath, encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"  skip {fpath}: {e}"); continue

              by_date = data.get("by_date", {})
              imported = 0
              for ds, payload in by_date.items():
                  # Skip if already in DB — never overwrite existing data
                  exists = conn.execute(
                      "SELECT 1 FROM metadata WHERE date=? AND code=?", (ds, code)
                  ).fetchone()
                  if exists:
                      total_skipped += 1; continue
                  conn.execute(
                      "INSERT OR IGNORE INTO metadata (date,code,total_sh,issued_sh,fetched_at) VALUES (?,?,?,?,?)",
                      (ds, code, payload.get("total_sh",0), payload.get("issued_sh",0), now)
                  )
                  for p in payload.get("p", []):
                      pid  = p.get("pid","")
                      name = p.get("name","")
                      conn.execute(
                          "INSERT OR IGNORE INTO participants (pid, name) VALUES (?,?)",
                          (pid, name)
                      )
                      conn.execute(
                          "INSERT OR IGNORE INTO holdings (date,code,pid,shares,pct) VALUES (?,?,?,?,?)",
                          (ds, code, pid, p.get("sh",0), p.get("pct",0.0))
                      )
                  imported += 1
              total_imported += imported

          conn.commit()
          conn.close()

          n_dates = sqlite3.connect(DB).execute("SELECT COUNT(DISTINCT date) FROM holdings").fetchone()[0]
          n_rows  = sqlite3.connect(DB).execute("SELECT COUNT(*) FROM holdings").fetchone()[0]
          print(f"Done — imported={total_imported} skipped={total_skipped}")
          print(f"DB now has {n_dates} distinct dates, {n_rows:,} holdings rows")
          EOF
      - name: Show DB stats
        run: python ccass_sdw_library.py --stats
      - name: Verify DB before upload
        run: |
          ROWS=$(sqlite3 ccass_sdw.db "SELECT COUNT(*) FROM holdings;")
          echo "DB has $ROWS total holdings rows"
          [ "$ROWS" -gt 100 ] || \
            { echo "ERROR: DB has only $ROWS holdings rows — aborting upload"; exit 1; }
      - name: Upload DB to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          [ -f "ccass_sdw.db" ] && aws s3 cp ccass_sdw.db s3://hk-stock-monitor/ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}

  # ── HSI weekly price history (Saturday 11:00 HKT) ────────────────────────────
  hsi-weekly:
    name: HSI weekly update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: hsi-weekly
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 6') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'hsi-build')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Update HSI weekly history
        run: |
          if [ "${{ inputs.job }}" = "hsi-build" ]; then
            python build_hsi.py --rebuild
          else
            python build_hsi.py
          fi
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          [ -f hsi_weekly.json ] && git add hsi_weekly.json
          git diff --staged --quiet || \
            (git commit -m "HSI weekly: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Rank history backfill (manual) ───────────────────────────────────────────
  rank-history-backfill:
    name: Rank history backfill (${{ inputs.backfill_date || '2026-02-02' }} to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: rank-history-backfill
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'rank-history-backfill'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Download turnover files from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/turnover_2026.json turnover_2026.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || echo "Warning: turnover_2026.json not found"

      - name: Backfill rank_history.json (commit every 5 trading days)
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"

          START_DATE="${{ inputs.backfill_date }}"
          START_DATE="${START_DATE:-2026-02-02}"
          echo "Backfilling from $START_DATE to today"

          # Generate list of trading days
          python3 -c "
          from datetime import date, timedelta
          import holidays, sys
          hk    = holidays.HongKong()
          start = date.fromisoformat('$START_DATE')
          end   = date.today()
          cur   = start
          days  = []
          while cur <= end:
              if cur.weekday() < 5 and cur not in hk:
                  days.append(cur.isoformat())
              cur += timedelta(days=1)
          print('\n'.join(days))
          sys.stderr.write(f'Generated {len(days)} trading days\n')
          " > /tmp/trading_days.txt
          [ -s /tmp/trading_days.txt ] || { echo "ERROR: trading day generation failed"; exit 1; }

          COUNT=0
          while IFS= read -r DAY; do
            echo "=== Processing $DAY ==="
            # Skip if already in rank_history.json — allows resuming interrupted runs
            DAY_KEY=$(echo "$DAY" | tr -d '-')
            if python3 -c "
import json, os, sys
if not os.path.exists('rank_history.json'):
    sys.exit(1)
d = json.load(open('rank_history.json'))
sys.exit(0 if '$DAY_KEY' in d else 1)
" 2>/dev/null; then
              echo "  (already backfilled, skipping)"
              COUNT=$((COUNT + 1))
              continue
            fi
            python main.py --date "$DAY" || echo "WARNING: $DAY failed, continuing"
            COUNT=$((COUNT + 1))

            # Commit every 5 trading days — stage first, then pull rebase, then commit
            if [ $((COUNT % 5)) -eq 0 ]; then
              [ -f rank_history.json ] && git add rank_history.json
              git stash || true
              git pull --rebase
              git stash pop || true
              [ -f rank_history.json ] && git add rank_history.json
              git diff --staged --quiet || \
                (git commit -m "Rank history backfill progress: up to $DAY" && git push)
              echo "--- Committed progress up to $DAY ---"
            fi
          done < /tmp/trading_days.txt

          # Final commit — stash, pull rebase, pop, then stage and commit
          git stash || true
          git pull --rebase
          git stash pop || true
          [ -f rank_history.json ] && git add rank_history.json
          [ -f name_map.json ]     && git add name_map.json
          git diff --staged --quiet || \
            (git commit -m "Rank history backfill complete: $(date +'%Y-%m-%d %H:%M')" && git push)
          echo "Backfill done: $COUNT trading days processed"
