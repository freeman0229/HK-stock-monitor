          { echo "ERROR: DB download failed — aborting"; exit 1; }
      - name: Backfill SDW for date ${{ inputs.backfill_date }} (3 workers)
        env:
          SDW_WORKERS: "3"
          SDW_WORKER_TIMEOUT: "21000"  # 350 min — matches 360 min job timeout with 10 min buffer
        run: python ccass_sdw_library.py --date "${{ inputs.backfill_date }}"
      - name: Verify DB before upload
        run: |
          DATE="${{ inputs.backfill_date }}"
          COUNT=$(sqlite3 ccass_sdw.db "SELECT COUNT(*) FROM holdings WHERE date='${DATE}';")
          echo "DB has $COUNT holdings rows for ${DATE}"
          [ "$COUNT" -gt 100 ] || \
            { echo "ERROR: DB has only $COUNT rows for ${DATE} — aborting upload to protect R2 data"; exit 1; }
      - name: Upload DB to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          [ -f "ccass_sdw.db" ] && aws s3 cp ccass_sdw.db s3://hk-stock-monitor/ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
      - name: Export SDW chart files
        run: python ccass_sdw_library.py --export-charts
      - name: Upload SDW chart files to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 sync . s3://hk-stock-monitor/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --exclude "*" --include "sdw_*.json" \
            --no-progress

  # ── SDW migrate JSON → SQLite (one-time) ─────────────────────────────────────
  # Downloads existing DB from R2, migrates schema if needed, then imports any
  # missing dates from sdw_*.json files in R2. Never deletes existing data.
  sdw-migrate-json:
    name: SDW migrate ccass_sdw_*.json → ccass_sdw.db
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sdw-db-lock
      cancel-in-progress: false
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-migrate-json'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Download existing DB from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/ccass_sdw.db ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          { echo "ERROR: DB download failed — aborting"; exit 1; }
      - name: Migrate schema to v5 (normalise participants)
        run: python ccass_sdw_library.py --migrate-schema
      - name: Download sdw_*.json files from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 sync s3://hk-stock-monitor/ . \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --exclude "*" --include "sdw_*.json" \
            --no-progress
          echo "Downloaded $(ls sdw_*.json 2>/dev/null | wc -l) JSON files" || true
      - name: Import missing dates from JSON files into DB
        run: |
          python3 - <<'EOF'
          import glob, json, os, sqlite3, re
          from datetime import datetime

          DB = "ccass_sdw.db"
          if not os.path.exists(DB):
              print(f"ERROR: {DB} not found — DB must be downloaded first"); exit(1)

          files = sorted(glob.glob("sdw_*.json"))
          print(f"Found {len(files)} sdw_*.json files to import")
          if not files:
              print("ERROR: no sdw_*.json files found"); exit(1)

          conn = sqlite3.connect(DB)

          # Ensure v5 schema tables exist (safe — CREATE TABLE IF NOT EXISTS)
          conn.executescript("""
              CREATE TABLE IF NOT EXISTS metadata (
                  date TEXT NOT NULL, code TEXT NOT NULL,
                  total_sh INTEGER NOT NULL DEFAULT 0,
                  issued_sh INTEGER NOT NULL DEFAULT 0,
                  fetched_at TEXT,
                  PRIMARY KEY (date, code));
              CREATE TABLE IF NOT EXISTS participants (
                  pid   TEXT PRIMARY KEY,
                  name  TEXT NOT NULL);
              CREATE TABLE IF NOT EXISTS holdings (
                  date TEXT NOT NULL, code TEXT NOT NULL,
                  pid TEXT NOT NULL,
                  shares INTEGER NOT NULL, pct REAL NOT NULL,
                  PRIMARY KEY (date, code, pid));
              CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT NOT NULL);
              CREATE INDEX IF NOT EXISTS idx_meta_date ON metadata(date);
              CREATE INDEX IF NOT EXISTS idx_hold_date_code ON holdings(date, code);
          """)

          total_imported = 0
          total_skipped  = 0
          now = datetime.utcnow().isoformat(timespec="seconds") + "Z"

          for fpath in files:
              code = os.path.basename(fpath).replace("sdw_","").replace(".json","")
              if not re.match(r'^\d{5}$', code):
                  print(f"  skip {fpath}: cannot parse code")
                  continue
              try:
                  with open(fpath, encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"  skip {fpath}: {e}"); continue

              by_date = data.get("by_date", {})
              imported = 0
              for ds, payload in by_date.items():
                  # Skip if already in DB — never overwrite existing data
                  exists = conn.execute(
                      "SELECT 1 FROM metadata WHERE date=? AND code=?", (ds, code)
                  ).fetchone()
                  if exists:
                      total_skipped += 1; continue
                  conn.execute(
                      "INSERT OR IGNORE INTO metadata (date,code,total_sh,issued_sh,fetched_at) VALUES (?,?,?,?,?)",
                      (ds, code, payload.get("total_sh",0), payload.get("issued_sh",0), now)
                  )
                  for p in payload.get("p", []):
                      pid  = p.get("pid","")
                      name = p.get("name","")
                      conn.execute(
                          "INSERT OR IGNORE INTO participants (pid, name) VALUES (?,?)",
                          (pid, name)
                      )
                      conn.execute(
                          "INSERT OR IGNORE INTO holdings (date,code,pid,shares,pct) VALUES (?,?,?,?,?)",
                          (ds, code, pid, p.get("sh",0), p.get("pct",0.0))
                      )
                  imported += 1
              total_imported += imported

          conn.commit()
          conn.close()

          n_dates = sqlite3.connect(DB).execute("SELECT COUNT(DISTINCT date) FROM holdings").fetchone()[0]
          n_rows  = sqlite3.connect(DB).execute("SELECT COUNT(*) FROM holdings").fetchone()[0]
          print(f"Done — imported={total_imported} skipped={total_skipped}")
          print(f"DB now has {n_dates} distinct dates, {n_rows:,} holdings rows")
          EOF
      - name: Show DB stats
        run: python ccass_sdw_library.py --stats
      - name: Verify DB before upload
        run: |
          ROWS=$(sqlite3 ccass_sdw.db "SELECT COUNT(*) FROM holdings;")
          echo "DB has $ROWS total holdings rows"
          [ "$ROWS" -gt 100 ] || \
            { echo "ERROR: DB has only $ROWS holdings rows — aborting upload"; exit 1; }
      - name: Upload DB to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          [ -f "ccass_sdw.db" ] && aws s3 cp ccass_sdw.db s3://hk-stock-monitor/ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}

  # ── HSI weekly price history (Saturday 11:00 HKT) ────────────────────────────
  hsi-weekly:
    name: HSI weekly update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: hsi-weekly
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 6') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'hsi-build')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Update HSI weekly history
        run: |
          if [ "${{ inputs.job }}" = "hsi-build" ]; then
            python build_hsi.py --rebuild
          else
            python build_hsi.py
          fi
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          [ -f hsi_weekly.json ] && git add hsi_weekly.json
          git diff --staged --quiet || \
            (git commit -m "HSI weekly: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Rank history backfill (manual) ───────────────────────────────────────────
  rank-history-backfill:
    name: Rank history backfill (${{ inputs.backfill_date || '2026-02-02' }} to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: rank-history-backfill
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'rank-history-backfill'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Download turnover files from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/turnover_2026.json turnover_2026.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || echo "Warning: turnover_2026.json not found"

      - name: Backfill rank_history.json (commit every 5 trading days)
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"

          START_DATE="${{ inputs.backfill_date }}"
          START_DATE="${START_DATE:-2026-02-02}"
          echo "Backfilling from $START_DATE to today"

          # Generate list of trading days
          python3 -c "
          from datetime import date, timedelta
          import holidays, sys
          hk    = holidays.HongKong()
          start = date.fromisoformat('$START_DATE')
          end   = date.today()
          cur   = start
          days  = []
          while cur <= end:
              if cur.weekday() < 5 and cur not in hk:
                  days.append(cur.isoformat())
              cur += timedelta(days=1)
          print('\n'.join(days))
          sys.stderr.write(f'Generated {len(days)} trading days\n')
          " > /tmp/trading_days.txt
          [ -s /tmp/trading_days.txt ] || { echo "ERROR: trading day generation failed"; exit 1; }

          COUNT=0
          while IFS= read -r DAY; do
            echo "=== Processing $DAY ==="
            # Skip if already in rank_history.json — allows resuming interrupted runs
            DAY_KEY=$(echo "$DAY" | tr -d '-')
            if [ -f rank_history.json ] && python3 -c "import json,sys; d=json.load(open('rank_history.json')); sys.exit(0 if '${DAY_KEY}' in d else 1)" 2>/dev/null; then
              echo "  (already backfilled, skipping)"
              COUNT=$((COUNT + 1))
              continue
            fi
            python main.py --date "$DAY" || echo "WARNING: $DAY failed, continuing"
            COUNT=$((COUNT + 1))

            # Commit every 5 trading days — stage first, then pull rebase, then commit
            if [ $((COUNT % 5)) -eq 0 ]; then
              [ -f rank_history.json ] && git add rank_history.json
              git stash || true
              git pull --rebase
              git stash pop || true
              [ -f rank_history.json ] && git add rank_history.json
              git diff --staged --quiet || \
                (git commit -m "Rank history backfill progress: up to $DAY" && git push)
              echo "--- Committed progress up to $DAY ---"
            fi
          done < /tmp/trading_days.txt

          # Final commit — stash, pull rebase, pop, then stage and commit
          git stash || true
          git pull --rebase
          git stash pop || true
          [ -f rank_history.json ] && git add rank_history.json
          [ -f name_map.json ]     && git add name_map.json
          git diff --staged --quiet || \
            (git commit -m "Rank history backfill complete: $(date +'%Y-%m-%d %H:%M')" && git push)
          echo "Backfill done: $COUNT trading days processed"

  # ── TV+Short per-stock full rebuild (manual) ─────────────────────────────────
  # Rebuilds all tv_{code5}.json from local turnover + short files → uploads to R2.
  # Use after structural changes to tv_{code5}.json schema or to fix corrupt files.
  tv-stock-build:
    name: TV+Short per-stock full rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: tv-stock-build
      cancel-in-progress: false
    permissions:
      contents: read
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'tv-stock-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Download turnover files from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
          R2_ENDPOINT_URL      : ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          aws s3 cp s3://hk-stock-monitor/turnover_2025.json turnover_2025.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
          aws s3 cp s3://hk-stock-monitor/turnover_2026.json turnover_2026.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}

      - name: Build all tv_{code5}.json → R2 (backfill with verify+retry)
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
          R2_ENDPOINT_URL      : ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          MAX_RETRIES=5
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "=== Attempt $attempt / $MAX_RETRIES ==="
            python build_tv_stock.py --rebuild

            echo "=== Verifying completeness ==="
            MISSING=$(python3 - <<'PYEOF'
          import subprocess, re, os, json, glob
          from ccass_universe import get_universe_codes
          # Determine which universe stocks actually appear in local turnover data
          stocks_with_data = set()
          for fname in glob.glob("turnover_*.json"):
              try:
                  with open(fname) as f:
                      tv = json.load(f)
                  for ds, stocks in tv.get("by_date", {}).items():
                      stocks_with_data.update(stocks.keys())
              except Exception:
                  pass
          universe = set(get_universe_codes())
          # Only expect R2 files for stocks that appear in turnover data
          expected = universe & stocks_with_data
          endpoint = os.environ["R2_ENDPOINT_URL"]
          r = subprocess.run(
              ["aws", "s3", "ls", "s3://hk-stock-monitor/",
               "--endpoint-url", endpoint],
              capture_output=True, text=True, timeout=60)
          on_r2 = set(re.findall(r"tv_(\d{5})\.json", r.stdout))
          # Missing = expected on R2 but absent
          missing = expected - on_r2
          # Incomplete = on R2 but local file still present and shows no pre-2026 data
          # (local files are deleted after upload so this is best-effort)
          incomplete = set()
          for code5 in on_r2 & universe:
              path = f"tv_{code5}.json"
              if os.path.exists(path):
                  try:
                      with open(path) as f:
                          data = json.load(f)
                      dates = list(data.get("by_date", {}).keys())
                      if dates and min(dates) >= "2026-01-01" and code5 in stocks_with_data:
                          incomplete.add(code5)
                  except Exception:
                      pass
          total_missing = missing | incomplete
          no_data = universe - stocks_with_data
          print(f"Universe={len(universe)} WithData={len(expected)} OnR2={len(on_r2)} Missing={len(missing)} Incomplete={len(incomplete)} NoTurnoverData={len(no_data)}")
          if total_missing:
              print("MISSING:" + ",".join(sorted(total_missing)[:50]))
              exit(1)
          else:
              print("ALL_COMPLETE")
              exit(0)
          PYEOF
            )
            echo "$MISSING"
            if echo "$MISSING" | grep -q "ALL_COMPLETE"; then
              echo "All stocks verified on R2"
              exit 0
            fi
            echo "Some stocks missing — retrying..."
          done
          echo "WARNING: some stocks still missing after $MAX_RETRIES attempts"
          exit 1

  # ── Turnover from Yahoo (manual) ─────────────────────────────────────────────
  # Rebuilds turnover_YYYY.json from yahoo_{code5}.json files stored on R2.
  # Use when turnover_YYYY.json is missing stocks (e.g. 02800) that exist in Yahoo.
  # After this completes, run tv-stock-build to merge into tv_{code5}.json.
  turnover-from-yahoo:
    name: Rebuild turnover from Yahoo R2 files (${{ inputs.tfy_from_year || '2025' }}-${{ inputs.tfy_to_year || '2026' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: turnover-from-yahoo
      cancel-in-progress: false
    permissions:
      contents: read
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'turnover-from-yahoo'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Rebuild turnover_2025.json and turnover_2026.json from Yahoo R2 files
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
          R2_ENDPOINT_URL      : ${{ secrets.R2_ENDPOINT_URL }}
          TFY_FROM_YEAR        : ${{ inputs.tfy_from_year || '2025' }}
          TFY_TO_YEAR          : ${{ inputs.tfy_to_year   || '2026' }}
        run: |
          # Dates >= 2026-02-02 are always protected (HKEX raw data from that date)
          python build_turnover_from_yahoo.py --rebuild --from-year $TFY_FROM_YEAR --to-year $TFY_TO_YEAR

      - name: Upload turnover files to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
          R2_ENDPOINT_URL      : ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          aws s3 cp turnover_2025.json s3://hk-stock-monitor/turnover_2025.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} --no-progress
          echo "Uploaded turnover_2025.json to R2"
          if [ -f turnover_2026.json ]; then
            aws s3 cp turnover_2026.json s3://hk-stock-monitor/turnover_2026.json \
              --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} --no-progress
            echo "Uploaded turnover_2026.json to R2"
          fi

      - name: Verify
        run: |
          python3 - <<'PYEOF'
          import json, os
          for fname in ['turnover_2025.json', 'turnover_2026.json']:
              if not os.path.exists(fname): continue
              d = json.load(open(fname))
              dates = sorted(d['by_date'].keys())
              code = '02800'
              print(f'{fname}: {len(dates)} dates ({dates[0]} to {dates[-1]})')
              print(f'  {code} present: {code in d["by_date"].get(dates[0], {})}')
              if dates:
                  sample = d['by_date'][dates[0]].get(code, {})
                  print(f'  {code} close on {dates[0]}: {sample.get("close")}')
          PYEOF
