name: Daily Sync

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 11:00 UTC / 19:00 HKT (Mon–Fri) — early fetch
    - cron: '0 12 * * 1-5'   # 12:00 UTC / 20:00 HKT (Mon–Fri)
    - cron: '0 6 * * 6'    # 06:00 UTC / 14:00 HKT (Saturday) — SDW weekly (self-retries internally)
    - cron: '0 2 * * 6'       # 02:00 UTC / 10:00 HKT (Saturday)
    - cron: '0 3 * * 6'       # 03:00 UTC / 11:00 HKT (Saturday)  — HSI weekly update
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - early-fetch
          - sfc-weekly
          - di-weekly
          - both-weekly
          - ccass-build
          - sc-top10-build
          - sdw-build
          - sdw-weekly
          - sfc-build
          - turnover-build   # rebuild turnover library from scratch
          - short-build      # rebuild short selling library from scratch
          - ccass-universe   # rebuild CCASS universe
          - sdw-backfill     # manual: backfill a specific date range (2 workers, conservative)
          - sdw-backfill-3w  # manual: backfill a specific date range (3 workers, recommended)
          - sdw-migrate-json # one-time: import old ccass_sdw_*.json files into SQLite DB
          - hsi-build        # manual: rebuild full HSI weekly history from scratch
          - rank-history-backfill  # manual: rebuild rank_history.json from 2026-02-02
          - tv-stock-build   # manual: full rebuild of all tv_{code5}.json on R2
          - turnover-from-yahoo  # manual: rebuild turnover_YYYY.json from yahoo_{code5}.json on R2
      tfy_from_year:
        description: 'turnover-from-yahoo: start year (default: 2025)'
        required: false
        default: '2025'
        type: string
      tfy_to_year:
        description: 'turnover-from-yahoo: end year (default: 2026, dates >= 2026-02-02 always protected)'
        required: false
        default: '2026'
        type: string

      backfill_date:
        description: 'Date to backfill (YYYY-MM-DD) — e.g. 2025-04-11. Required for sdw-backfill.'
        required: false
        default: ''
        type: string


jobs:

  # ── Early fetch (Mon–Fri 19:00 HKT) ──────────────────────────────────────────
  # Stock Connect top-10 and CCASS southbound data are published ~18:xx HKT.
  # Fetching at 19:00 gives main.py fresh data when it runs at 20:00.
  early-fetch:
    name: Early fetch — Stock Connect + CCASS southbound
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: early-fetch
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'early-fetch')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium

      - name: Update Stock Connect top10 (today + repair incomplete history)
        run: python sc_top10_library.py --update

      - name: Update CCASS southbound holdings (today)
        run: python ccass_library.py --update --fix-names

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sc_top10_20*.json ccass_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Early fetch: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Daily analysis (Mon–Fri 20:00 HKT) ─────────────────────────────────────
  # Depends on early-fetch (19:00) having already committed sc_top10 + ccass data.
  # [Fix] timeout-minutes: 45 → 30. Tighter ceiling gives yahoo-backfill (13:30 UTC)
  #       a guaranteed 60-min gap instead of the previous 45-min gap, preventing
  #       simultaneous R2 access if daily ever ran close to its old timeout.
  daily:
    name: Daily analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: daily
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'daily')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
        # Note: playwright not needed here — sc_top10 + ccass run in early-fetch job at 19:00

      - name: Download turnover files from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
          R2_ENDPOINT_URL      : ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          aws s3 cp s3://hk-stock-monitor/turnover_2026.json turnover_2026.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          echo "Warning: turnover_2026.json not found in R2"
          aws s3 cp s3://hk-stock-monitor/turnover_2025.json turnover_2025.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          echo "Warning: turnover_2025.json not found in R2"

      - name: Fetch today's turnover data
        run: python build_turnover.py
        # Parses HKEX quotation file (d{YYMMDD}c.htm top section) → writes turnover_{Y}.json

      - name: Fetch today's short selling data
        run: python build_short.py
        # Parses short sell section from next trading day's file → writes short_{Y}.json
        # Short data has 1-day lag by design: D's short is published in D+1's file.

      - name: Download SDW DB from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/ccass_sdw.db ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          echo "Warning: ccass_sdw.db not found in R2 — SDW holders will be empty"

      - name: Run daily analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Upload turnover_2026.json to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
          R2_ENDPOINT_URL      : ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          [ -f turnover_2026.json ] && aws s3 cp turnover_2026.json \
            s3://hk-stock-monitor/turnover_2026.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          echo "Warning: turnover_2026.json upload failed"

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in data.json rank_history.json name_map.json; do
            [ -f "$f" ] && git add "$f"
          done
          for f in short_20*.json sfc_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          # Note: turnover_20*_??.json monthly files removed — frontend now uses tv_{code5}.json from R2
          # sc_top10_20*.json and ccass_20*.json committed by early-fetch at 19:00
          git diff --staged --quiet || \
            (git commit -m "Update data: $(date +'%Y-%m-%d %H:%M')" && git push)

      - name: Build per-stock TV+Short files → upload to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
          R2_ENDPOINT_URL      : ${{ secrets.R2_ENDPOINT_URL }}
        run: python build_tv_stock.py
        # Runs AFTER commit — so timeout here never blocks data.json update
        # Reads all local turnover_{YYYY}.json + short_{YYYY}.json
        # Merges per stock per day → tv_{code5}.json → uploads to R2
        # Incremental: never overwrites existing dates

  # ── CCASS full build (manual) ────────────────────────────────────────────────
  ccass-build:
    name: CCASS full build (2025-03-23 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: ccass-build
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'ccass-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Build CCASS library
        run: python ccass_library.py --fix-names
      - name: Commit progress
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in ccass_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "CCASS build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Stock Connect top10 full build (manual) ───────────────────────────────────
  sc-top10-build:
    name: Stock Connect top10 full build (2025-09-01 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: sc-top10-build
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sc-top10-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SC top10 cache
        uses: actions/cache@v4
        with:
          path: sc_cache
          key: sc-top10-cache-${{ github.run_id }}
          restore-keys: sc-top10-cache-
      - name: Clear stale sc_cache
        run: python sc_top10_library.py --clear-cache
      - name: Build Stock Connect top10 library
        run: python sc_top10_library.py
      - name: Save SC top10 cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: sc_cache
          key: sc-top10-cache-${{ github.run_id }}
      - name: Commit progress
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sc_top10_20*.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || \
            (git commit -m "SC top10 build: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SDW full backfill (manual) ───────────────────────────────────────────────
  # Fetches all scheduled Fridays from START_DATE into ccass_sdw.db.
  # Run sdw-migrate-json first if you have existing ccass_sdw_*.json files.
  sdw-build:
    name: SDW full backfill (all dates → SQLite DB)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: sdw-db-lock
      cancel-in-progress: false
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Download DB from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/ccass_sdw.db ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          { echo "ERROR: DB download failed — aborting"; exit 1; }
      - name: Full SDW backfill → ccass_sdw.db
        env:
          SDW_WORKERS: "3"
          SDW_WORKER_TIMEOUT: "21000"  # 350 min — matches 360 min job timeout with 10 min buffer
        run: |
          python ccass_sdw_library.py
      - name: Verify DB before upload
        run: |
          DATES=$(sqlite3 ccass_sdw.db "SELECT COUNT(DISTINCT date) FROM holdings;")
          ROWS=$(sqlite3 ccass_sdw.db "SELECT COUNT(*) FROM holdings;")
          echo "DB has $DATES distinct dates and $ROWS total holdings rows"
          [ "$ROWS" -gt 100 ] || \
            { echo "ERROR: DB has only $ROWS holdings rows — aborting upload to protect R2 data"; exit 1; }
      - name: Upload DB to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          [ -f "ccass_sdw.db" ] && aws s3 cp ccass_sdw.db s3://hk-stock-monitor/ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
      - name: Export SDW chart files
        run: python ccass_sdw_library.py --export-charts
      - name: Upload SDW chart files to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 sync . s3://hk-stock-monitor/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --exclude "*" --include "sdw_*.json" \
            --no-progress

  # ── SDW weekly (Saturday: 14:00 HKT) ──────────────────────────────────────────
  # Runs --update: fetches only the latest Friday not yet in the DB.
  #
  # [Fix] Previous design: two separate cron triggers (06:00 + 10:00 UTC) sharing
  #       sdw-db-lock with cancel-in-progress: false.
  #       Problem 1: run 1 typically finishes by 07:30 UTC — the 10:00 cron then
  #         fires a redundant third job into the queue, wasting a runner.
  #       Problem 2: coverage per run was 79.6% (1052/1543 pending). Run 2 only needs
  #         ~42 min for the remaining 489 stocks — 5400s timeout was fine, but the
  #         10:00 cron could arrive after run 1 had already queued run 2 automatically.
  #       Fix: single cron at 06:00 UTC. The job itself retries --update up to 3 times
  #         with a DB upload after each attempt, so all remaining stocks are fetched
  #         in one job execution. Coverage math: run1≈79.6%, run2≈100% of remainder.
  #         Total job time ≈ 90 + 42 + 10 (upload/export overhead) ≈ 145 min.
  #       SDW_WORKER_TIMEOUT: 21000s (350 min wall-clock per worker — matches 360 min job timeout).
  #       job timeout-minutes: 300 → sufficient (145 min typical + buffer).
  sdw-weekly:
    name: SDW weekly update → ccass_sdw.db
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: sdw-db-lock
      cancel-in-progress: false
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 6') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'sdw-weekly')

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - name: Download DB from R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 cp s3://hk-stock-monitor/ccass_sdw.db ccass_sdw.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || \
          { echo "ERROR: DB download failed — aborting"; exit 1; }

      # Retry loop: run --update up to 3 times. Each attempt saves what it can
      # in 5400s (90 min), uploads to R2, then the next attempt picks up where
      # the previous left off (--update is idempotent: skips already-saved stocks).
      # Typically: attempt 1 ≈ 90 min (79.6% done), attempt 2 ≈ 42 min (100%).
      # The loop exits early as soon as coverage reaches 100% (no pending stocks).
      - name: Fetch latest Friday SDW data (up to 3 attempts)
        env:
          SDW_WORKERS      : "3"
          SDW_WORKER_TIMEOUT: "21000"  # 350 min — matches 360 min job timeout with 10 min buffer
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
          R2_ENDPOINT_URL      : ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== SDW fetch attempt $attempt / $MAX_ATTEMPTS ==="
            python ccass_sdw_library.py --update

            echo "--- Verifying coverage after attempt $attempt ---"
            ROWS=$(sqlite3 ccass_sdw.db "SELECT COUNT(*) FROM holdings;" 2>/dev/null || echo 0)
            echo "DB holdings rows: $ROWS"
            [ "$ROWS" -gt 100 ] || { echo "ERROR: too few rows after attempt $attempt"; exit 1; }

            echo "--- Uploading DB to R2 after attempt $attempt ---"
            aws s3 cp ccass_sdw.db s3://hk-stock-monitor/ccass_sdw.db \
              --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}

            # Check if any stocks are still pending for this date
            # --update exits 0 whether it finishes fully or hits the worker timeout.
            # We detect completion by running --update again in dry-run style:
            # if Python reports 0 pending it prints "nothing to fetch" and exits 0.
            PENDING=$(python3 -c "
          import sys
          try:
              from ccass_sdw_library import get_pending_count
              n = get_pending_count()
              print(n)
          except Exception:
              print(-1)
          " 2>/dev/null || echo -1)

            echo "Pending after attempt $attempt: $PENDING"
            if [ "$PENDING" = "0" ]; then
              echo "All stocks fetched — exiting retry loop after attempt $attempt"
              break
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Still $PENDING pending — sleeping 30s then retrying..."
              sleep 30
            else
              echo "WARNING: $PENDING stocks still pending after $MAX_ATTEMPTS attempts — partial coverage acceptable"
            fi
          done

      - name: Verify DB before final export
        run: |
          DATES=$(sqlite3 ccass_sdw.db "SELECT COUNT(DISTINCT date) FROM holdings;")
          ROWS=$(sqlite3 ccass_sdw.db "SELECT COUNT(*) FROM holdings;")
          echo "DB has $DATES distinct dates and $ROWS total holdings rows"
          [ "$ROWS" -gt 100 ] || \
            { echo "ERROR: DB has only $ROWS holdings rows — aborting export"; exit 1; }
      - name: Export SDW chart files
        run: python ccass_sdw_library.py --export-charts
      - name: Upload SDW chart files to R2
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION   : auto
        run: |
          aws s3 sync . s3://hk-stock-monitor/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --exclude "*" --include "sdw_*.json" \
            --no-progress

  # ── SFC weekly (Saturday 10:00 HKT) ──────────────────────────────────────────
  sfc-weekly:
    name: SFC short position library
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sfc-weekly
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 6') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'sfc-weekly' || inputs.job == 'both-weekly'))

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Restore SFC cache
        uses: actions/cache@v4
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
          restore-keys: sfc-cache-
      - name: Update CCASS participant list
        run: |
          python ccass_participant_library.py --update || \
          echo "Warning: participant update failed, continuing"

      - name: Update CCASS universe
        run: |
          python ccass_universe.py || \
          echo "Warning: universe update failed, continuing"

      - name: Update SFC library
        run: python sfc_library.py
      - name: Re-parse cached Excel files
        run: python sfc_library.py --reparse
      - name: Save SFC cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: sfc_cache
          key: sfc-cache-${{ github.run_id }}
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in sfc_20*.json; do [ -f "$f" ] && git add "$f"; done
          [ -f "ccass_participants.json" ] && git add "ccass_participants.json"
          [ -f "ccass_universe.json" ] && git add "ccass_universe.json"
          git diff --staged --quiet || \
            (git commit -m "SFC weekly: $(date +'%Y-%m-%d')" && git push)

  # ── Turnover + short full rebuild (manual) ───────────────────────────────────
  # Re-fetches every trading day from START_DATE. Use --rebuild to overwrite existing.
  # build_turnover.py writes BOTH turnover_{Y}.json AND short_{Y}.json (same source page).
  # build_short.py --rebuild is also run to backfill any edge-case date gaps.
  # turnover_{YYYY}.json: name_en, name_zh, prev_close, close, vol, tv, high, low
  # short_{YYYY}.json:    name, sv (股數SH), st (金額$)
  turnover-build:
    name: Turnover + short full rebuild (2026-02-02 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: turnover-build
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'turnover-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Rebuild turnover library (all stocks, all columns)
        run: python build_turnover.py --rebuild

      - name: Rebuild short selling library (all stocks, all columns)
        run: python build_short.py --rebuild

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in short_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Turnover+short rebuild: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── Short selling full rebuild (manual, standalone) ─────────────────────────
  # Use when you need to rebuild ONLY short_{Y}.json without touching turnover.
  # For a full rebuild of both, use turnover-build instead (it runs both scripts).
  # short_{YYYY}.json: name, sv (股數SH), st (金額$)
  short-build:
    name: Short selling library full rebuild (2026-02-02 to today)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: short-build
      cancel-in-progress: true
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'short-build'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: Rebuild short selling library (all stocks, all columns)
        run: python build_short.py --rebuild

      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          for f in short_20*.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "Short rebuild: $(date +'%Y-%m-%d %H:%M')" && git push)

  # ── SFC full backfill (manual) ────────────────────────────────────────────────
  sfc-build:
